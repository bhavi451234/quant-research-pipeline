# Generated by experiments/run_selection.py - do not edit by hand.
# Each stock's strategy was chosen on 2014-01-01 to 2019-12-31 data only,
# so the evaluation windows never influenced the choice (no hindsight).

experiment_name: portfolio_best_per_ticker
data:
  start_date: '2018-01-01'
  end_date: '2025-12-31'
features:
- name: price_to_sma
  params:
    window: 10
- name: price_to_sma
  params:
    window: 20
- name: price_to_sma
  params:
    window: 50
- name: price_to_ema
  params:
    span: 10
- name: price_to_ema
  params:
    span: 20
- name: price_to_ema
  params:
    span: 50
- name: rsi
  params:
    window: 14
- name: volatility
  params:
    window: 10
- name: volatility
  params:
    window: 20
- name: momentum
  params:
    window: 5
- name: momentum
  params:
    window: 10
- name: momentum
  params:
    window: 20
- name: bollinger_position
  params:
    window: 20
    num_std: 2.0
- name: ema
  params:
    span: 20
- name: ema
  params:
    span: 50
- name: sma
  params:
    window: 20
- name: sma
  params:
    window: 50
ml:
  model_type: logistic
  feature_columns:
  - price_to_sma_window10
  - price_to_sma_window20
  - price_to_sma_window50
  - price_to_ema_span10
  - price_to_ema_span20
  - price_to_ema_span50
  - rsi_window14
  - volatility_window10
  - volatility_window20
  - momentum_window5
  - momentum_window10
  - momentum_window20
  - bollinger_position_window20_num_std2.0
  threshold: 0.05
walk_forward:
  train_size: 504
  test_size: 126
backtest:
  transaction_cost_bps: 5
  slippage_bps: 2
  position_size_pct: 1.0
evaluation:
  risk_free_rate_annual: 0.05
  metrics:
  - sharpe
  - sortino
  - max_drawdown
  - cagr
  - total_return
  per_ticker_metrics:
  - sharpe
  - sortino
  - max_drawdown
  - win_rate
  - turnover
  - direction_accuracy
  - cagr
  - total_return
portfolio:
  allocations:
    AAPL: 100000
    MSFT: 80000
    TSLA: 50000
    SNAP: 70000
    JPM: 80000
    XOM: 60000
    JNJ: 70000
  per_ticker_strategy:
    AAPL:
      type: strategy
      name: momentum_strategy
      params:
        momentum_window: 20
        threshold: 0.02
    MSFT:
      type: ml
      model_type: logistic
      feature_columns: &id001
      - price_to_sma_window10
      - price_to_sma_window20
      - price_to_sma_window50
      - price_to_ema_span10
      - price_to_ema_span20
      - price_to_ema_span50
      - rsi_window14
      - volatility_window10
      - volatility_window20
      - momentum_window5
      - momentum_window10
      - momentum_window20
      - bollinger_position_window20_num_std2.0
      threshold: 0.05
    TSLA:
      type: ml
      model_type: logistic
      feature_columns: *id001
      threshold: 0.05
    SNAP:
      type: ml
      model_type: logistic
      feature_columns: *id001
      threshold: 0.05
    JPM:
      type: strategy
      name: sma_crossover
      params: &id002
        fast_window: 20
        slow_window: 50
    XOM:
      type: strategy
      name: sma_crossover
      params: *id002
    JNJ:
      type: strategy
      name: ema_crossover
      params:
        fast_span: 20
        slow_span: 50

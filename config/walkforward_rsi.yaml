experiment_name: "rsi_mean_reversion_walkforward"

data:
  tickers: ["AAPL", "MSFT", "TSLA", "SNAP"]
  start_date: "2018-01-01"
  end_date: "2024-12-31"

features:
  - name: rsi
    params: { window: 14 }

strategy:
  name: rsi_mean_reversion
  params:
    rsi_window: 14
    oversold: 30
    overbought: 70

walk_forward:
  train_size: 504
  test_size: 126

backtest:
  initial_capital: 100000
  transaction_cost_bps: 5
  slippage_bps: 2
  position_size_pct: 1.0

evaluation:
  risk_free_rate_annual: 0.05
  metrics: ["sharpe", "sortino", "max_drawdown", "win_rate", "turnover", "cagr"]